<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<link rel="stylesheet" href="/node_modules/@xterm/xterm/css/xterm.css">
	<link rel="stylesheet" href="/media/main.css">
</head>
<body>
	<h1>Wrapped terminal link MRE</h1>
	<p>The terminal is fixed at <strong>38 columns</strong>.</p>
	<div id="terminal" aria-label="Wrapped link test terminal"></div>
	<dl class="results">
		<div><dt>Buffer check</dt><dd id="buffer-check">Waiting…</dd></div>
		<div><dt>Last activation</dt><dd id="activation">None</dd></div>
	</dl>
	<script>
		window.MRE_CONFIG = {
			fixturePath: "/Users/yiheng/pi-vscode/wordwrap-link-mre/fixtures/a-very-long-file-name-used-to-verify-soft-wrapped-terminal-links.md",
			testUrl: "https://example.com/a/very/long/path/used/to/verify/soft-wrapped-terminal-links",
		};
		window.acquireVsCodeApi = () => ({
			postMessage(message) {
				document.body.dataset.lastMessage = JSON.stringify(message);
			},
		});
	</script>
	<script src="/node_modules/@xterm/xterm/lib/xterm.js"></script>
	<script src="/node_modules/@xterm/addon-web-links/lib/addon-web-links.js"></script>
	<script src="/media/wrapped-path-links.js"></script>
	<script src="/media/main.js"></script>
</body>
</html>
